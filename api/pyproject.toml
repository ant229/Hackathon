[project]
name = "parking-monitor-api"
version = "0.1.0"
description = "SpotStack FastAPI backend + in-memory simulator for South Bethlehem / Lehigh parking"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "hypothesis==6.170.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
