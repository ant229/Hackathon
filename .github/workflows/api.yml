name: api

on:
  pull_request:
    paths: ["api/**", "simulator/**", "fixtures/**", "ruff.toml", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", "simulator/**", "fixtures/**", "ruff.toml", "fly.toml", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check api simulator
      - run: pytest
        working-directory: api
      - name: Simulator dry run
        run: python -m simulator.run --dry-run --backfill 3

  deploy:
    # Deploys API + simulator to Fly on merge to main. Needs repo secret FLY_API_TOKEN.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Check for Fly token
        id: token
        run: echo "present=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - run: flyctl deploy --remote-only
        if: steps.token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - if: steps.token.outputs.present != 'true'
        run: echo "::notice::FLY_API_TOKEN not set - skipping deploy."
