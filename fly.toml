# Fly.io config for the API + simulator. Deploy from the repo root:  fly deploy
# First time: change `app` to a unique name, then run `fly launch --no-deploy --copy-config`.
app = "lehigh-parking-api"
primary_region = "ewr"

[build]
  dockerfile = "api/Dockerfile"

[env]
  CORS_ORIGINS = "*"
  SIM_TICK_SECONDS = "60"

[processes]
  app = "sh -c 'cd api && uvicorn app.main:app --host 0.0.0.0 --port 8080'"
  worker = "python -m simulator.run"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # no cold starts during the demo
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
